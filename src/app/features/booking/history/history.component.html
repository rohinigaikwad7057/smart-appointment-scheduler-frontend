<div class="appointments-container" role="main" aria-label="Appointment History Page">

  <!-- HEADER -->
  <div class="page-header">
    <h1>Appointment History</h1>

    <div class="filters" role="region" aria-label="Appointment filters">
      <mat-button-toggle-group 
        [value]="filterType" 
        (change)="filterType = $event.value; applyFilter()"
        aria-label="Filter appointments by type">

        <mat-button-toggle value="upcoming" aria-label="Show upcoming appointments">
          Upcoming
        </mat-button-toggle>

        <mat-button-toggle value="past" aria-label="Show past appointments">
          Past
        </mat-button-toggle>

      </mat-button-toggle-group>

      <span class="count" aria-live="polite">
        {{ totalAppointments }} appointments
      </span>
    </div>
  </div>

  <!-- APPOINTMENTS GRID -->
  <div class="appointments-grid" role="region" aria-label="Appointments list">

    <ng-container *ngIf="pagedAppointments.length; else empty">
      <mat-card 
        class="appointment-card" 
        *ngFor="let appt of pagedAppointments"
        role="article"
        aria-label="Appointment details">

        <!-- HEADER -->
        <div class="card-header">
          <h2>{{ appt.treatmentId?.name }}</h2>

          <button 
            mat-icon-button 
            color="warn" 
            *ngIf="filterType === 'upcoming'" 
            (click)="cancelAppointment(appt._id)"
            aria-label="Cancel this appointment">
            <mat-icon aria-hidden="true">delete</mat-icon>
          </button>
        </div>

        <!-- BODY -->
        <div class="card-body">
          <p><strong>Doctor:</strong> {{ appt.doctorId?.name }}</p>
          <p><strong>Specialization:</strong> {{ appt.doctorId?.specialization }}</p>
          <p><strong>Date:</strong> {{ appt.date | date:'dd MMM yyyy' }}</p>
          <p><strong>Slot:</strong> {{ appt.slot }}</p>
        </div>

        <!-- FOOTER -->
        <div class="card-footer">
          <span 
            class="status" 
            [ngClass]="appt.status.toLowerCase()"
            aria-label="Appointment status">
            {{ appt.status }}
          </span>
        </div>

      </mat-card>
    </ng-container>

    <!-- EMPTY STATE -->
    <ng-template #empty>
      <div class="empty-state" role="status" aria-live="polite">
        No appointments found.
      </div>
    </ng-template>

  </div>

  <!-- PAGINATOR -->
  <mat-paginator 
    [length]="totalAppointments" 
    [pageSize]="pageSize" 
    [pageSizeOptions]="[6, 12, 24]"
    (page)="onPageChange($event)"
    aria-label="Appointment list pagination">
  </mat-paginator>

</div>
