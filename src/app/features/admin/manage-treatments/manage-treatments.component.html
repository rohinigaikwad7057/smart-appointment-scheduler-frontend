<div class="page-header" role="region" aria-label="Manage Treatments Header">
  <h1 style="margin-bottom: 30px;margin-top: 30px;">Manage Treatments</h1>

  <button 
    class="pre-btn" 
    mat-raised-button 
    color="primary" 
    *ngIf="!showAddForm" 
    (click)="showAddForm = true"
    aria-label="Open Add Treatment Form">
    <mat-icon aria-hidden="true">add</mat-icon>
    Add Treatment
  </button>
</div>

<!-- ADD TREATMENT FORM -->
<mat-card class="doctor-card" *ngIf="showAddForm" role="region" aria-labelledby="addTreatmentHeading">

  <div class="card-header">
    <div>
      <h2 id="addTreatmentHeading">Add Treatment</h2>
    </div>

    <button mat-icon-button (click)="showAddForm = false" aria-label="Close Add Treatment Form">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="addTreatment()" class="doctor-form" aria-label="Treatment form">

    <mat-form-field appearance="outline">
      <mat-label>Treatment Name</mat-label>
      <input matInput formControlName="name" aria-required="true">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Duration (minutes)</mat-label>
      <input matInput type="number" formControlName="duration" aria-required="true">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Price</mat-label>
      <input matInput type="number" formControlName="price" aria-required="true">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput rows="2" formControlName="description" aria-required="true"></textarea>
    </mat-form-field>

    <div class="experience-row">
      <button 
        mat-raised-button 
        color="primary" 
        class="add-btn" 
        [disabled]="form.invalid"
        aria-label="Submit new treatment form">
        <mat-icon aria-hidden="true">check</mat-icon>
        Add Treatment
      </button>
    </div>

  </form>
</mat-card>

<!-- TREATMENTS TABLE -->
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8"
       role="table" aria-label="Treatments list">

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef scope="col">Name</th>
    <td mat-cell *matCellDef="let t">{{ t.name }}</td>
  </ng-container>

  <ng-container matColumnDef="duration">
    <th mat-header-cell *matHeaderCellDef scope="col">Duration (minutes)</th>
    <td mat-cell *matCellDef="let t">{{ t.duration }}</td>
  </ng-container>

  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef scope="col">Price</th>
    <td mat-cell *matCellDef="let t">{{ t.price }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef scope="col">Action</th>
    <td mat-cell *matCellDef="let t">
      <button 
        mat-button 
        color="warn" 
        (click)="deleteTreatment(t._id)"
        aria-label="Delete treatment {{ t.name }}">
        Delete
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator 
  [pageSize]="pageSize" 
  [pageSizeOptions]="[5, 10, 20]" 
  showFirstLastButtons
  aria-label="Treatments table pagination">
</mat-paginator>
